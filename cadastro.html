<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Breno Neves Nascimento">
    <meta name="description" content="Cadastrar seu e-mail no site">
    <meta name="keywords" content="cadastro, entrar, iniciar sessão">
    <link rel="stylesheet" href="css/cadastro.css">
    <title>Cadastrar-se no TalkSense</title>
</head>
<body>
    <div class="container">
        <a class="titulo" href="main.html"><h1>TalkSense</h1></a>
    </div>
        <div class="caixa-cadastro">
            <div class="cadastro">
                <form action="">
                    <div class="mensagem">    
                        <h2>Bem-Vindo(a)</h2>
                        <h2>ao TalkSense</h2>
                    </div>
                    <div class="input-group">
                        <label for="nome-usuario">Usuário:</label>
                        <input type="text" placeholder=" Digite seu nome de usuário" id="nome-usuario" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" placeholder=" Digite seu e-mail" required>
                    </div>

                    <div class="input-group">  
                        <label for="senha">Senha:</label>
                        <input type="password" placeholder=" Senha (+8 caracteres)" id="senha" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmar-senha">Confirmar Senha:</label>
                        <input type="password" placeholder=" Confirme sua senha" id="confirmar-senha" required>
                    </div>     

                    <button type="submit" class="botao-cadastro">Cadastrar</button>
                        
                </form>
            </div>
        </div>
        <button class="botao-voltar"><a href="login.html">◀ Voltar</a></button>
</body>
</html>
