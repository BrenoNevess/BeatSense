<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Breno Neves Nascimento">
    <meta name="description" content="Cadastrar seu e-mail no site">
    <meta name="keywords" content="cadastro, entrar, iniciar sessão">
    <link rel="stylesheet" href="/src/styles/cadastro.css">
    <title>Cadastrar-se no TalkSense</title>
</head>
<body>
    <div class="container">
        <a class="titulo" href="/src/index.html"><h1>TalkSense</h1></a>
    </div>
        <div class="caixa-cadastro">
            <div class="cadastro">
                <form action="">
                    <div class="mensagem">    
                        <h2>Bem-Vindo(a)</h2>
                        <h2>ao TalkSense</h2>
                    </div>
                    <div class="input-group">
                        <div class="wrapper">
                            <input type="text" class="input" id="text" required>
                            <label class="label" for="text">Digite seu nome</label>
                            <span class="top-line"></span>
                            <span class="bottom-line"></span>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="wrapper">
                            <input type="email" class="input" id="email" required>
                            <label class="label" for="email">Digite seu e-mail</label>
                            <span class="top-line"></span>
                            <span class="bottom-line"></span>
                        </div>
                    </div>

                    <div class="input-group">  
                        <div class="wrapper">
                            <input type="password" class="input" id="email" required>
                            <label class="label" for="email">Senha (+8 caracteres)</label>
                            <span class="topline"></span>
                            <span class="bottom-line"></span>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="wrapper">
                            <input type="password" class="input" id="password" required>
                            <label class="label" for="password">Confirme sua senha</label>
                            <span class="top--line"></span>
                            <span class="bottom-line"></span>
                        </div>
                    </div>     

                    <button type="submit" class="botao-cadastro">Cadastrar</button>
                        
                </form>
            </div>
        </div>
        <button class="botao-voltar"><a href="/src/login.html">◀ Voltar</a></button>
</body>
</html>
